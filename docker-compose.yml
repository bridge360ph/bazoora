services:
  db:
    image: postgres:17
    container_name: bazoora-db
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bazoora

    volumes:
      - bazoora-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bazoora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bazoora-data: