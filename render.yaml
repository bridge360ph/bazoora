# Render Blueprint for Bazoora (staging).
#
# One repo, two services per environment:
#   - bazoora      : the API (Fastify Node web service)
#   - bazoora-web  : the PWA frontend (Vite static site, served from Render's CDN)
#
# The Postgres database is intentionally NOT declared here. Databases are
# stateful and env-specific (their name, user, and credentials differ per env),
# and infrastructure-as-code should not be able to recreate or delete them. The
# DB is provisioned once in the dashboard (staging: `staging-db`) and its
# Internal Database URL is pasted into DATABASE_URL below (sync: false).
#
# Values marked `sync: false` are NOT stored here; set them per-environment in
# the Render dashboard (Environment tab). Everything else is reproducible.
#
# Cross-wiring done once in the dashboard:
#   - bazoora      DATABASE_URL  = the DB's Internal Database URL (e.g. staging-db)
#   - bazoora      CORS_ORIGIN   = https://<the static site URL>
#   - bazoora-web  VITE_API_URL  = https://<the API service URL>
# VITE_* vars are baked in at build time, so changing them requires a rebuild.
#
# Runtime note (API): started with tsx (see @bazoora/api "start" script), not
# `node dist/...`. @bazoora/db exports TypeScript source (packages/db/src), so a
# compiled dist entry cannot resolve it at runtime. tsx runs the API from source
# and resolves the workspace packages; the build still runs so @bazoora/shared
# and @bazoora/ui emit the dist the API imports.

services:
  # --- API (Fastify) ---
  - type: web
    name: bazoora
    runtime: node
    plan: free
    region: singapore
    branch: staging
    autoDeploy: true
    healthCheckPath: /
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bazoora/db db:deploy && pnpm build --filter=@bazoora/api
    startCommand: pnpm --filter @bazoora/api start
    envVars:
      # Paste the DB's Internal Database URL here in the dashboard (staging: the
      # `staging-db` Internal Database URL). Internal avoids egress and works at
      # build time for the migrate step; append `?sslmode=require` if using an
      # external URL.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Pin to match CI (Node 22); Render otherwise defaults to the latest.
      - key: NODE_VERSION
        value: "22"
      # Comma-separated allowlist of frontend origins (the static site URL).
      # Set in the dashboard. Must be explicit origins, never "*", because the
      # API enables CORS credentials.
      - key: CORS_ORIGIN
        sync: false
      # Optional: only needed if the S3 upload features are exercised.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

  # --- Frontend (Vite PWA, static) ---
  - type: web
    name: bazoora-web
    runtime: static
    branch: staging
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter=@bazoora/web
    staticPublishPath: apps/web/dist
    # SPA client-side routing: serve index.html for any path without a matching
    # static file. Real files (assets, sw.js, manifest) are served directly first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full URL of the API service, e.g. https://bazoora.onrender.com.
      # Baked in at build time, so a change needs a rebuild.
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
